<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#2563eb">
<link rel="manifest" href="/static/manifest.json">
<title>SliqChat</title>

<style>
*{box-sizing:border-box}
body{
margin:0;
height:100vh;
font-family:Inter,Segoe UI,sans-serif;
background:#07111f;
color:#e5edf8;
overflow:hidden;
}
.app{
display:flex;
height:100vh;
}
.sidebar{
width:330px;
background:#0a1626;
border-right:1px solid rgba(255,255,255,.06);
display:flex;
flex-direction:column;
}
.header{
height:72px;
padding:14px 17px;
display:flex;
align-items:center;
gap:12px;
border-bottom:1px solid rgba(255,255,255,.06);
}
.logo{
width:43px;
height:43px;
border-radius:12px;
}
.brand{
font-size:19px;
font-weight:800;
}
.me{
font-size:11px;
color:#718096;
}
.search{
padding:12px;
}
.search input{
width:100%;
padding:12px 14px;
border-radius:12px;
border:1px solid rgba(255,255,255,.06);
background:#07111f;
color:white;
outline:none;
}
.chats{
flex:1;
overflow:auto;
padding:5px 9px 80px;
}
.chat{
display:flex;
gap:12px;
align-items:center;
padding:12px;
border-radius:13px;
cursor:pointer;
transition:.18s;
}
.chat:hover{
background:rgba(59,130,246,.08);
}
.chat.active{
background:rgba(37,99,235,.16);
}
.avatar{
width:45px;
height:45px;
border-radius:50%;
display:flex;
align-items:center;
justify-content:center;
background:linear-gradient(135deg,#2563eb,#60a5fa);
color:white;
font-weight:800;
flex:none;
}
.chatinfo{
min-width:0;
}
.chatname{
font-weight:700;
font-size:14px;
}
.preview{
color:#718096;
font-size:12px;
white-space:nowrap;
overflow:hidden;
text-overflow:ellipsis;
margin-top:3px;
}
.plus{
position:fixed;
left:265px;
bottom:25px;
width:55px;
height:55px;
border:0;
border-radius:18px;
background:#2563eb;
color:white;
font-size:28px;
box-shadow:0 14px 35px rgba(37,99,235,.35);
cursor:pointer;
transition:.2s;
z-index:20;
}
.plus:hover{
transform:scale(1.08) rotate(4deg);
}
.main{
flex:1;
display:flex;
flex-direction:column;
min-width:0;
}
.empty{
margin:auto;
text-align:center;
color:#718096;
}
.empty .big{
font-size:60px;
margin-bottom:15px;
}
.chathead{
height:72px;
display:flex;
align-items:center;
padding:0 22px;
border-bottom:1px solid rgba(255,255,255,.06);
}
.chathead strong{
font-size:16px;
}
.messages{
flex:1;
overflow:auto;
padding:25px;
display:flex;
flex-direction:column;
gap:8px;
}
.msg{
max-width:min(65%,600px);
padding:10px 13px;
border-radius:15px;
background:#132338;
animation:messageIn .2s ease;
}
.msg.own{
align-self:flex-end;
background:#2563eb;
}
@keyframes messageIn{
from{opacity:0;transform:translateY(5px)}
to{opacity:1;transform:none}
}
.sender{
font-size:10px;
font-weight:700;
color:#93c5fd;
margin-bottom:4px;
}
.msg.own .sender{display:none}
.msg img{
max-width:320px;
max-height:320px;
border-radius:10px;
display:block;
margin-top:5px;
}
.composer{
display:flex;
align-items:center;
gap:8px;
padding:13px 17px;
border-top:1px solid rgba(255,255,255,.06);
}
.composer input[type=text]{
flex:1;
padding:13px 15px;
border-radius:13px;
border:1px solid rgba(255,255,255,.07);
background:#0b1829;
color:white;
outline:none;
}
.iconbtn{
width:43px;
height:43px;
border:0;
border-radius:12px;
background:#102238;
color:#93c5fd;
cursor:pointer;
font-size:18px;
}
.send{
width:47px;
height:43px;
border:0;
border-radius:12px;
background:#2563eb;
color:white;
cursor:pointer;
}
.modal{
position:fixed;
inset:0;
display:none;
align-items:center;
justify-content:center;
background:rgba(0,0,0,.55);
backdrop-filter:blur(8px);
z-index:50;
}
.modal.open{display:flex}
.modalbox{
width:min(430px,92%);
background:#0d192b;
border:1px solid rgba(255,255,255,.08);
border-radius:20px;
padding:23px;
box-shadow:0 30px 90px rgba(0,0,0,.5);
animation:modalIn .25s ease;
}
@keyframes modalIn{
from{opacity:0;transform:scale(.95)}
to{opacity:1;transform:none}
}
.modalbox h2{margin-top:0}
.modalbox input{
width:100%;
padding:12px;
margin:7px 0;
border-radius:11px;
border:1px solid rgba(255,255,255,.08);
background:#07111f;
color:white;
}
.modalbox button{
padding:12px;
border:0;
border-radius:11px;
background:#2563eb;
color:white;
font-weight:700;
cursor:pointer;
margin-top:8px;
}
.modalbox .secondary{
background:#18283d;
}
.results{
max-height:200px;
overflow:auto;
}
.result{
padding:10px;
border-radius:10px;
cursor:pointer;
}
.result:hover{
background:rgba(59,130,246,.1);
}
.install{
position:fixed;
right:20px;
bottom:20px;
padding:11px 15px;
border:1px solid rgba(96,165,250,.2);
border-radius:12px;
background:#0d192b;
color:#dbeafe;
cursor:pointer;
box-shadow:0 12px 35px rgba(0,0,0,.3);
}
@media(max-width:700px){
.sidebar{width:100%}
.main{display:none}
.sidebar.chat-open{display:none}
.plus{left:auto;right:20px}
}
</style>
</head>

<body>

<div class="app">

<aside class="sidebar">

<div class="header">
<img class="logo" src="/static/sliqchat-logo.svg">
<div>
<div class="brand">SliqChat</div>
<div class="me" id="me"></div>
</div>
</div>

<div class="search">
<input id="search" placeholder="Chats durchsuchen..." oninput="loadChats()">
</div>

<div class="chats" id="chats"></div>

<button class="plus" onclick="openModal()">+</button>

</aside>

<main class="main">

<div class="empty" id="empty">
<div class="big">✉️</div>
<strong>Willkommen bei SliqChat</strong>
<div>Starte einen privaten Chat oder erstelle eine Gruppe.</div>
</div>

<div id="chatView" style="display:none;height:100%;flex-direction:column">

<div class="chathead">
<strong id="chatTitle"></strong>
</div>

<div class="messages" id="messages"></div>

<form class="composer" id="messageForm">

<label class="iconbtn">
📷
<input type="file" id="image" accept="image/*" hidden>
</label>

<input type="text" id="message" placeholder="Nachricht schreiben..." autocomplete="off">

<button class="send">➤</button>

</form>

</div>

</main>

</div>

<button class="install" id="installButton"><span class="install-icon">↓</span><span class="install-text"><span class="install-title">SliqChat installieren</span><span class="install-subtitle">Als App installieren</span></span><span class="install-arrow">›</span></button>

<div class="modal" id="modal">

<div class="modalbox">

<h2>Hinzufügen</h2>

<button onclick="showPrivate()">Person hinzufügen</button>
<button onclick="showGroup()">Gruppe erstellen</button>
<button class="secondary" onclick="closeModal()">Abbrechen</button>

<div id="privateBox" style="display:none;margin-top:15px">

<input id="userSearch" placeholder="Benutzer suchen..." oninput="searchUsers()">
<div class="results" id="userResults"></div>

</div>

<div id="groupBox" style="display:none;margin-top:15px">

<input id="groupName" placeholder="Gruppenname">

<input id="groupMembers" placeholder="Mitglieder-IDs (z.B. 2,3)">

<button onclick="createGroup()">Gruppe erstellen</button>

</div>

</div>
</div>

<script>

let currentConversation = null;
let deferredPrompt = null;

async function api(url, options={}) {
    const response = await fetch(url, options);

    if(response.status === 401){
        location.href="/login";
        return null;
    }

    return response.json();
}

async function init(){

    const me = await api("/api/me");

    if(!me) return;

    document.getElementById("me").textContent = "@" + me.username;

    loadChats();

    if("serviceWorker" in navigator){
        navigator.serviceWorker.register("/service-worker.js");
    }
}

async function loadChats(){

    const chats = await api("/api/conversations");

    if(!chats) return;

    const container = document.getElementById("chats");
    container.innerHTML = "";

    for(const chat of chats){

        const div = document.createElement("div");
        div.className = "chat";

        const preview =
            chat.last_image
            ? "📷 Bild"
            : (chat.last_message || "Noch keine Nachrichten");

        div.innerHTML = `
            <div class="avatar">${escapeHtml((chat.name || "?")[0].toUpperCase())}</div>
            <div class="chatinfo">
                <div class="chatname">${escapeHtml(chat.name)}</div>
                <div class="preview">${escapeHtml(preview)}</div>
            </div>
        `;

        div.onclick = () => openChat(chat.id, chat.name);

        container.appendChild(div);
    }
}

async function openChat(id,name){

    currentConversation = id;

    document.getElementById("empty").style.display = "none";

    const view = document.getElementById("chatView");
    view.style.display = "flex";

    document.getElementById("chatTitle").textContent = name;

    loadMessages();

    if(window.innerWidth <= 700){
        document.querySelector(".sidebar").classList.add("chat-open");
    }
}

async function loadMessages(){

    if(!currentConversation) return;

    const messages = await api(
        `/api/conversations/${currentConversation}/messages`
    );

    if(!messages) return;

    const container = document.getElementById("messages");

    container.innerHTML = "";

    for(const message of messages){

        const div = document.createElement("div");

        div.className = "msg" + (message.own ? " own" : "");

        let html = "";

        if(!message.own){
            html += `<div class="sender">${escapeHtml(message.username)}</div>`;
        }

        if(message.text){
            html += `<div>${escapeHtml(message.text)}</div>`;
        }

        if(message.image){
            html += `<img src="${message.image}" loading="lazy">`;
        }

        div.innerHTML = html;

        container.appendChild(div);
    }

    container.scrollTop = container.scrollHeight;
}

document.getElementById("messageForm").addEventListener("submit", async event => {

    event.preventDefault();

    if(!currentConversation) return;

    const text = document.getElementById("message").value.trim();
    const image = document.getElementById("image").files[0];

    if(!text && !image) return;

    const form = new FormData();

    form.append("text",text);

    if(image){
        form.append("image",image);
    }

    await api(
        `/api/conversations/${currentConversation}/messages`,
        {
            method:"POST",
            body:form
        }
    );

    document.getElementById("message").value = "";
    document.getElementById("image").value = "";

    await loadMessages();
    await loadChats();
});

function openModal(){
    document.getElementById("modal").classList.add("open");
}

function closeModal(){
    document.getElementById("modal").classList.remove("open");
}

function showPrivate(){

    document.getElementById("privateBox").style.display = "block";
    document.getElementById("groupBox").style.display = "none";

    document.getElementById("userSearch").focus();
}

function showGroup(){

    document.getElementById("privateBox").style.display = "none";
    document.getElementById("groupBox").style.display = "block";

    document.getElementById("groupName").focus();
}

async function searchUsers(){

    const search = document.getElementById("userSearch").value.trim();

    if(!search){
        document.getElementById("userResults").innerHTML = "";
        return;
    }

    const users = await api(
        "/api/users?search=" + encodeURIComponent(search)
    );

    const container = document.getElementById("userResults");

    container.innerHTML = "";

    for(const user of users){

        const div = document.createElement("div");

        div.className = "result";

        div.textContent = "@" + user.username;

        div.onclick = async () => {

            const result = await api(
                "/api/conversations/private",
                {
                    method:"POST",
                    headers:{
                        "Content-Type":"application/json"
                    },
                    body:JSON.stringify({
                        user_id:user.id
                    })
                }
            );

            closeModal();

            await loadChats();

            openChat(result.id,user.username);
        };

        container.appendChild(div);
    }
}

async function createGroup(){

    const name = document.getElementById("groupName").value.trim();

    const raw = document
        .getElementById("groupMembers")
        .value
        .split(",")
        .map(x => parseInt(x.trim()))
        .filter(x => !isNaN(x));

    if(!name){
        alert("Bitte einen Gruppennamen eingeben.");
        return;
    }

    const result = await api(
        "/api/groups",
        {
            method:"POST",
            headers:{
                "Content-Type":"application/json"
            },
            body:JSON.stringify({
                name:name,
                members:raw
            })
        }
    );

    if(result && result.id){

        closeModal();

        await loadChats();

        openChat(result.id,name);
    }
}

function escapeHtml(value){

    return String(value ?? "")
        .replaceAll("&","&amp;")
        .replaceAll("<","&lt;")
        .replaceAll(">","&gt;")
        .replaceAll('"',"&quot;")
        .replaceAll("'","&#039;");
}

window.addEventListener("beforeinstallprompt", event => {

    event.preventDefault();

    deferredPrompt = event;

    document.getElementById("installButton").style.display = "block";
});

document.getElementById("installButton").onclick = async () => {

    if(!deferredPrompt){

        alert(
            "Die Installation ist in diesem Browser momentan nicht verfügbar. " +
            "Auf Chrome oder Edge kannst du SliqChat über das Installationssymbol " +
            "in der Adressleiste installieren."
        );

        return;
    }

    deferredPrompt.prompt();

    await deferredPrompt.userChoice;

    deferredPrompt = null;

    document.getElementById("installButton").style.display = "none";
};

window.addEventListener("appinstalled", () => {
    document.getElementById("installButton").style.display = "none";
});

init();

setInterval(() => {

    if(currentConversation){
        loadMessages();
    }

},5000);

</script>

</body>
</html>
