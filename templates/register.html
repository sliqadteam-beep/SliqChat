<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#2563eb">
<link rel="manifest" href="/static/manifest.json">
<title>SliqChat – Registrieren</title>

<style>
*{box-sizing:border-box}
body{
margin:0;
min-height:100vh;
display:flex;
align-items:center;
justify-content:center;
font-family:Inter,Segoe UI,sans-serif;
background:
radial-gradient(circle at 20% 20%,rgba(37,99,235,.18),transparent 35%),
radial-gradient(circle at 80% 80%,rgba(96,165,250,.12),transparent 35%),
#07111f;
color:white;
}
.card{
width:min(430px,92%);
padding:38px;
background:rgba(13,25,43,.85);
border:1px solid rgba(255,255,255,.08);
border-radius:25px;
backdrop-filter:blur(25px);
box-shadow:0 30px 90px rgba(0,0,0,.45);
animation:show .6s ease;
}
@keyframes show{
from{opacity:0;transform:translateY(25px) scale(.97)}
to{opacity:1;transform:none}
}
.logo{
width:82px;
height:82px;
display:block;
margin:auto;
border-radius:22px;
}
h1{text-align:center;margin:20px 0 7px}
.sub{text-align:center;color:#8292aa;margin-bottom:25px}
label{display:block;color:#aab8cc;font-size:13px;margin:15px 0 7px}
input{
width:100%;
padding:14px;
border-radius:13px;
border:1px solid rgba(255,255,255,.09);
background:#091525;
color:white;
outline:none;
}
input:focus{
border-color:#3b82f6;
box-shadow:0 0 0 4px rgba(59,130,246,.1);
}
button{
width:100%;
padding:14px;
margin-top:21px;
border:0;
border-radius:13px;
background:#2563eb;
color:white;
font-weight:700;
cursor:pointer;
}
.error{
padding:12px;
border-radius:11px;
background:rgba(239,68,68,.12);
color:#fca5a5;
font-size:13px;
margin-bottom:15px;
}
.link{text-align:center;color:#8292aa;font-size:13px;margin-top:20px}
a{color:#60a5fa;text-decoration:none}
.lang{
position:fixed;
right:20px;
bottom:20px;
}
.lang select{
background:#0d192b;
color:#dbeafe;
border:1px solid rgba(255,255,255,.1);
border-radius:12px;
padding:10px;
}
</style>
</head>

<body>

<div class="card">
<img class="logo" src="/static/sliqchat-logo.svg">

<h1>SliqChat</h1>
<div class="sub">Erstelle deinen Account</div>

{% if error %}
<div class="error">{{ error }}</div>
{% endif %}

<form method="POST">

<label>Benutzername</label>
<input name="username" minlength="3" maxlength="24" autocomplete="username" required>

<label>Passwort</label>
<input type="password" name="password" minlength="8" autocomplete="new-password" required>

<label>Passwort wiederholen</label>
<input type="password" name="password2" minlength="8" autocomplete="new-password" required>

<button type="submit">Account erstellen</button>

</form>

<div class="link">
Bereits registriert?
<a href="/login">Anmelden</a>
</div>

</div>

<div class="lang">
<select onchange="setLanguage(this.value)">
<option>Deutsch</option>
<option>English</option>
<option>Español</option>
<option>Français</option>
<option>Italiano</option>
<option>Português</option>
<option>Türkçe</option>
<option>Polski</option>
<option>Nederlands</option>
<option>Русский</option>
<option>Українська</option>
<option>العربية</option>
<option>中文</option>
<option>日本語</option>
<option>한국어</option>
</select>
</div>

<script>
function setLanguage(language){
localStorage.setItem("sliqchat_language",language);
}
if("serviceWorker" in navigator){
navigator.serviceWorker.register("/service-worker.js");
}
</script>

</body>
</html>
